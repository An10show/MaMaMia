<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MaMaMia Pizzaria | Cardápio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FFFFFF; --ink:#2A1512; --muted:#6E5651; --line:#E8CFC9;
  --hero:#B3231A; --hero-deep:#7E140E; --accent:#C8281E; --cheese:#F6C945; --basil:#1F5A34;
  --check:rgba(200,40,30,.09); --chip-ink:#3A1A00;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#24110F; --ink:#FBEDE6; --muted:#CBAAA2; --line:#4A2A25;
    --accent:#FF8073; --check:rgba(255,255,255,.04);
  }
}
:root[data-theme="dark"]{
  --paper:#24110F; --ink:#FBEDE6; --muted:#CBAAA2; --line:#4A2A25;
  --accent:#FF8073; --check:rgba(255,255,255,.04);
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0; color:var(--ink); font:400 1rem/1.5 "DM Sans",system-ui,sans-serif;
  background-color:var(--paper);
  background-image:linear-gradient(90deg,var(--check) 50%,transparent 50%),linear-gradient(var(--check) 50%,transparent 50%);
  background-size:44px 44px;
}
h1,h2,h3{margin:0;font-weight:400}
.display{font-family:"Bagel Fat One","Arial Rounded MT Bold",system-ui,sans-serif}
a{color:inherit}
:focus-visible{outline:3px solid var(--cheese);outline-offset:2px}

/* Hero */
.hero{position:relative;isolation:isolate;background:#000;color:#fff;padding:2.5rem 1.25rem 3rem;overflow:hidden}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 35%,#000 100%)}
.bokeh{position:absolute;inset:0;z-index:-2}
.bokeh span{position:absolute;border-radius:50%;opacity:.35;filter:blur(7px);background:radial-gradient(circle,rgba(255,215,80,.95),rgba(255,170,0,.4) 45%,rgba(255,170,0,0) 70%);animation:tw var(--d) ease-in-out infinite alternate}
@keyframes tw{from{opacity:.12}to{opacity:.6}}
.hero-in{position:relative;max-width:1080px;margin:0 auto;display:grid;gap:1.5rem;align-items:center}
@media(min-width:860px){.hero-in{grid-template-columns:1.05fr .95fr;min-height:560px}}
.hero h1{font-family:"Bagel Fat One","Arial Rounded MT Bold",system-ui,sans-serif;font-weight:400;font-size:clamp(3.4rem,13vw,7.5rem);line-height:1;margin:0}
.hero h1 span{animation:flick 1.8s both}
.hero h1 .g{color:#8dffbf;text-shadow:0 0 6px #00ff87,0 0 20px #00ff87,0 0 46px rgba(0,255,135,.7)}
.hero h1 .w{color:#fff;text-shadow:0 0 6px #fff,0 0 20px rgba(255,255,255,.8),0 0 46px rgba(190,220,255,.5);animation-delay:.25s}
.hero h1 .r{color:#ff8fa0;text-shadow:0 0 6px #ff2d4b,0 0 20px #ff2d4b,0 0 46px rgba(255,45,75,.8);animation-delay:.5s}
@keyframes flick{0%,14%,18%,44%,48%,100%{opacity:1}0%{opacity:0}16%,46%{opacity:.2}30%{opacity:.9}}
.flag{display:flex;width:min(300px,70%);height:4px;margin:1rem 0 1.25rem}
.flag i{flex:1}
.flag i:nth-child(1){background:#00ff87;box-shadow:0 0 12px #00ff87}
.flag i:nth-child(2){background:#fff;box-shadow:0 0 12px #fff}
.flag i:nth-child(3){background:#ff2d4b;box-shadow:0 0 12px #ff2d4b}
.hero p{max-width:32ch;font-size:1.2rem;margin:0 0 1.5rem;color:#eee}
.btns{display:flex;flex-wrap:wrap;gap:.75rem}
.btn{display:inline-block;padding:.8rem 1.4rem;border-radius:999px;font-weight:700;text-decoration:none;border:2px solid;background:transparent;transition:background .2s,color .2s}
.btn.g{color:#00ff87;border-color:#00ff87;box-shadow:0 0 14px rgba(0,255,135,.55),inset 0 0 10px rgba(0,255,135,.2)}
.btn.g:hover{background:#00ff87;color:#000}
.btn.r{color:#ff6b80;border-color:#ff2d4b;box-shadow:0 0 14px rgba(255,45,75,.6),inset 0 0 10px rgba(255,45,75,.2)}
.btn.r:hover{background:#ff2d4b;color:#000}

/* Fotos flutuantes */
.stage{position:relative;height:clamp(340px,52vw,470px)}
.ph{position:absolute;width:var(--w);left:var(--x);top:var(--y);animation:bob var(--t) ease-in-out infinite alternate;animation-delay:var(--dl)}
.ph:hover,.ph:focus-within{z-index:5}
@keyframes bob{from{transform:translateY(-8px)}to{transform:translateY(10px)}}
.ph button{position:relative;display:block;width:100%;padding:0;border:2px solid var(--c);border-radius:16px;overflow:hidden;background:#000;cursor:zoom-in;transform:rotate(var(--r));box-shadow:0 0 14px var(--g);filter:brightness(.82);transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s,filter .35s}
.ph button:hover,.ph button:focus-visible{transform:rotate(0) scale(1.14);box-shadow:0 0 22px var(--c),0 0 64px var(--g);filter:none}
.ph img{display:block;width:100%;height:auto}
.cap{position:absolute;left:0;right:0;bottom:0;padding:1.2rem .75rem .5rem;text-align:left;font:700 .9rem "DM Sans",sans-serif;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.85));opacity:0;transition:opacity .3s}
.ph button:hover .cap,.ph button:focus-visible .cap{opacity:1}
@media(hover:none){.cap{opacity:1}}

/* Lightbox */
dialog{padding:0;border:2px solid #00ff87;border-radius:20px;background:#000;color:#fff;width:min(92vw,720px);overflow:hidden;box-shadow:0 0 30px rgba(0,255,135,.5),0 0 90px rgba(255,45,75,.3)}
dialog::backdrop{background:rgba(0,0,0,.85);backdrop-filter:blur(6px)}
dialog[open]{animation:pop .3s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{transform:scale(.85);opacity:0}}
#lbimg{display:block;width:100%;max-height:68vh;object-fit:cover}
.lb-bar{display:flex;flex-wrap:wrap;gap:.75rem;align-items:center;padding:1rem 1.25rem 1.25rem}
.lb-bar strong{flex:1 1 100%;font:400 1.6rem "Bagel Fat One",system-ui,sans-serif}
.lb-bar .btn{font:700 .95rem "DM Sans",sans-serif;cursor:pointer}

/* Tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:#000}
.tabs::after{content:"";display:block;height:3px;background:linear-gradient(90deg,#00ff87 33.3%,#fff 33.3% 66.6%,#ff2d4b 66.6%)}
.tabs-in{max-width:1080px;margin:0 auto;display:flex;gap:.5rem;overflow-x:auto;padding:.7rem 1.25rem;scrollbar-width:none}
.tab{flex:none;font:700 .95rem "DM Sans",sans-serif;padding:.5rem 1rem;border-radius:999px;border:2px solid #00ff87;background:transparent;color:#fff;cursor:pointer;transition:box-shadow .2s}
.tab:hover{box-shadow:0 0 12px rgba(0,255,135,.65)}
.tab[aria-selected="true"]{background:#00ff87;color:#000;box-shadow:0 0 14px rgba(0,255,135,.7)}
@media(prefers-reduced-motion:reduce){.hero h1 span,.bokeh span,.ph,dialog[open]{animation:none}html{scroll-behavior:auto}}

/* Menu */
main{max-width:1040px;margin:0 auto;padding:1.5rem 1.25rem 3rem}
.hint{margin:0 0 1.25rem;color:var(--muted);background:var(--paper);display:inline-block;padding:.25rem .75rem;border-radius:999px}
.panel{background:var(--paper);border:3px solid var(--hero);border-radius:22px;padding:1.5rem 1.25rem;margin-bottom:1.75rem}
.panel[hidden]{display:none}
.panel h2{font-family:"Bagel Fat One","Arial Rounded MT Bold",system-ui,sans-serif;font-size:1.9rem;color:var(--accent)}
.note{margin:.15rem 0 1rem;color:var(--muted);font-size:.95rem}
.list{list-style:none;margin:0;padding:0;display:grid;gap:0 2.5rem}
@media(min-width:800px){.list{grid-template-columns:1fr 1fr}}
.item{display:flex;justify-content:space-between;gap:1rem;padding:.9rem 0;border-top:2px dashed var(--line)}
.item h3{font-size:1.05rem;font-weight:700}
.item p{margin:.15rem 0 0;color:var(--muted);font-size:.92rem;max-width:40ch}
.veg{display:inline-block;margin-left:.4rem;padding:0 .5rem;border-radius:999px;background:var(--basil);color:#fff;font-size:.72rem;font-weight:500;vertical-align:middle}
.buy{display:flex;flex-direction:column;gap:.35rem;align-items:flex-end;flex:none}
.chip{display:block;white-space:nowrap;text-decoration:none;background:var(--cheese);color:var(--chip-ink);font-weight:700;font-size:.9rem;padding:.25rem .8rem;border-radius:999px}
.chip:hover{background:#FFDD70}

footer{background:#000;color:#fff;text-align:center;padding:2.5rem 1.25rem;border-top:4px solid;border-image:linear-gradient(90deg,#00ff87 33.3%,#fff 33.3% 66.6%,#ff2d4b 66.6%) 1}
footer h2{font-family:"Bagel Fat One","Arial Rounded MT Bold",system-ui,sans-serif;font-size:2rem;color:#fff;text-shadow:0 0 8px #00ff87,0 0 26px #00ff87}
footer p{margin:.5rem 0 1.25rem}
</style>
</head>

function brl(n){return "R$ " + n.toFixed(2).replace(".", ",");}
function waLink(text){return "https://wa.me/" + WA + "?text=" + encodeURIComponent(text);}

var menu = document.getElementById("menu");
var tabs = document.getElementById("tabs");

GROUPS.forEach(function(g){
  var lis = g.items.map(function(it){
    var chips = g.pizza
      ? it[2].map(function(p,i){
          return '<a class="chip" href="' + waLink("Olá! Quero uma pizza " + it[0] + " (" + SIZES[i] + ")") + '" target="_blank" rel="noopener">' + SIZES[i][0] + " " + brl(p) + "</a>";
        }).join("")
      : '<a class="chip" href="' + waLink("Olá! Quero pedir: " + it[0]) + '" target="_blank" rel="noopener">' + brl(it[2]) + "</a>";
    var veg = it[3] ? '<span class="veg">vegetariana</span>' : "";
    return '<li class="item"><div><h3>' + it[0] + veg + "</h3><p>" + it[1] + '</p></div><div class="buy">' + chips + "</div></li>";
  }).join("");
  menu.insertAdjacentHTML("beforeend",
    '<section class="panel" id="' + g.id + '" data-g="' + g.id + '"><h2>' + g.title + "</h2>" +
    (g.note ? '<p class="note">' + g.note + "</p>" : "") + '<ul class="list">' + lis + "</ul></section>");
});

var tabDefs = [{id:"todos", tab:"Tudo"}].concat(GROUPS);
tabDefs.forEach(function(t, i){
  var b = document.createElement("button");
  b.className = "tab"; b.type = "button"; b.setAttribute("role", "tab");
  b.setAttribute("aria-selected", i === 0 ? "true" : "false");
  b.textContent = t.tab;
  b.addEventListener("click", function(){ show(t.id); });
  tabs.appendChild(b);
});

function show(id){
  var i = 0;
  Array.prototype.forEach.call(tabs.children, function(b, idx){
    b.setAttribute("aria-selected", tabDefs[idx].id === id ? "true" : "false");
  });
  Array.prototype.forEach.call(menu.children, function(p){
    p.hidden = !(id === "todos" || p.dataset.g === id);
  });
  document.getElementById("cardapio").scrollIntoView({block:"start"});
}

Array.prototype.forEach.call(document.querySelectorAll("[data-wa]"), function(a){
  a.href = waLink(a.getAttribute("data-wa"));
  a.target = "_blank"; a.rel = "noopener";
});

(function(){
  var b = document.getElementById("bokeh");
  for (var i = 0; i < 16; i++) {
    var s = document.createElement("span"), z = 14 + Math.random() * 44;
    s.style.cssText = "left:" + (Math.random() * 96) + "%;top:" + (Math.random() * 92) + "%;width:" + z + "px;height:" + z + "px;--d:" + (3 + Math.random() * 5) + "s;animation-delay:-" + (Math.random() * 6) + "s";
    b.appendChild(s);
  }
})();
var lb = document.getElementById("lb");
Array.prototype.forEach.call(document.querySelectorAll(".ph button"), function(btn){
  btn.addEventListener("click", function(){
    var img = btn.querySelector("img"), n = btn.dataset.name;
    document.getElementById("lbimg").src = img.src;
    document.getElementById("lbimg").alt = img.alt;
    document.getElementById("lbcap").textContent = n;
    document.getElementById("lbwa").href = waLink("Olá! Quero uma pizza " + n + ".");
    lb.showModal();
  });
});
lb.addEventListener("click", function(e){ if (e.target === lb) lb.close(); });
document.getElementById("lbx").addEventListener("click", function(){ lb.close(); });
</script>
